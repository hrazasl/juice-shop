name: Kepler customer artifact acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532
        with:
          cosign-release: v3.0.2
      - name: Build and sign isolated acceptance image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/kepler-acceptance
          printf 'Kepler customer-owned trust acceptance\n' > /tmp/kepler-acceptance/receipt.txt
          printf 'FROM scratch\nCOPY receipt.txt /receipt.txt\n' > /tmp/kepler-acceptance/Dockerfile
          IMAGE="ttl.sh/kepler-hrazasl-acceptance-${GITHUB_RUN_ID}:1h"
          docker build -t "$IMAGE" /tmp/kepler-acceptance
          docker push "$IMAGE"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")
          cosign sign --yes "$DIGEST"
          printf '%s' '{"buildDefinition":{"buildType":"https://kepler.dev/acceptance/v1","resolvedDependencies":[{"uri":"git+https://github.com/hrazasl/juice-shop"}]},"runDetails":{"builder":{"id":"https://github.com/hrazasl/juice-shop/.github/workflows/ci.yml"}}}' > /tmp/kepler-acceptance/provenance.json
          cosign attest --yes --type=https://slsa.dev/provenance/v1 --predicate=/tmp/kepler-acceptance/provenance.json "$DIGEST"
          printf '%s\n' "$DIGEST" > /tmp/kepler-acceptance/image-ref.txt
          docker save "$IMAGE" | gzip > /tmp/kepler-acceptance/image.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: customer-artifact-acceptance
          path: |
            /tmp/kepler-acceptance/image-ref.txt
            /tmp/kepler-acceptance/image.tar.gz
          retention-days: 1
